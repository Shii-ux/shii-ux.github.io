<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>shii_ux</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
}

/* Background Bintang */

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:stars 70s linear infinite;
opacity:.6;
z-index:-2;
}

@keyframes stars{
from{
background-position:0 0;
}
to{
background-position:0 1500px;
}
}

/* Card */

.card{
width:360px;
padding:35px;
text-align:center;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
box-shadow:0 0 30px rgba(0,212,255,.3);
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Foto */

.profile{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:4px solid #00d4ff;
box-shadow:0 0 25px #00d4ff;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}

h1{
margin-top:20px;
font-size:30px;
}

p{
margin-top:10px;
color:#d1d5db;
}

/* Jam */

#clock{
margin-top:18px;
font-size:24px;
font-weight:bold;
color:#38bdf8;
text-shadow:0 0 15px #38bdf8;
}

/* Tombol */

button{
margin-top:25px;
padding:12px 28px;
border:none;
border-radius:12px;
background:#00bfff;
color:white;
font-size:18px;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 20px #00bfff;
cursor:pointer;
}

/* Icon */

.icon{
margin-top:28px;
font-size:30px;
}

.icon a{
color:white;
margin:12px;
transition:.3s;
}

.icon a:hover{
color:#38bdf8;
transform:translateY(-5px);
}
</style>

</head>

<body>

<div class="stars"></div>

<div class="card">

<img src="Profilshii_ux.jpg" class="profile">

<h1>Hello I'm shii_ux</h1>

<p>Welcome to my personal website.</p>

<div id="clock"></div>

<button onclick="halo()">Click Me</button>

<div class="icon">

<a href="https://github.com/shii-ux" target="_blank">
<i class="fab fa-github"></i>
</a>

<a href="#">
<i class="fab fa-discord"></i>
</a>

<a href="#">
<i class="fab fa-instagram"></i>
</a>

</div>

</div>

<script>

function halo(){
alert("Welcome to my website");
}

function updateClock(){

let now=new Date();

let h=String(now.getHours()).padStart(2,'0');
let m=String(now.getMinutes()).padStart(2,'0');
let s=String(now.getSeconds()).padStart(2,'0');

document.getElementById("clock").innerHTML=h+":"+m+":"+s;

}

setInterval(updateClock,1000);
updateClock();


</script>

</body>
</html>
